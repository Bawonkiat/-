<!doctype html>
<html lang="th">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สวัสดีบวรเกียรติ</title>
  <style>
    .greeting {
      background: linear-gradient(
        90deg,
        #ff0000 0%,
        #ff8000 16.67%,
        #ffff00 33.33%,
        #00cc00 50%,
        #0066ff 66.67%,
        #4b0082 83.33%,
        #8000ff 100%
      );
      background-clip: text;
      color: transparent;
      font-size: 67px;
    }
  </style>
</head>
<body>
  <p class="greeting">สวัสดีบวรเกียรติ</p>
